{% extends "base.html" %}
{# index.html — the main page: one tab per tool.

   How the tabs work (no JavaScript needed):
   Each tab is a hidden radio button plus its <label> in the top bar. Clicking
   a label checks its radio button. CSS in style.css (ToolkIT section) hides
   every tool panel except the one whose radio button is checked. Because the
   panels are only hidden, never removed, each tab keeps its form and result
   while you look at another tab.

   Clear: a type="reset" button puts the form's fields back to how the page
   first loaded them (the defaults). app.js also empties that tab's result.
   Other tabs aren't touched. Reloading the page clears all tabs.

   Variables:
     tab                    which tab starts selected ("ip", "mac", "convert", "hosts", "oui")
     ip_form / ip_result    (etc.) only set after a no-JavaScript form post,
                            to fill that tab's form back in and show its result #}

{% block nav %}
  {% for key, label in tabs %}
    <input type="radio" name="tab" id="tab-{{ key }}" class="tab-radio" {{ 'checked' if tab == key }}>
    <label for="tab-{{ key }}">{{ label }}</label>
  {% endfor %}
{% endblock %}

{% block content %}

{# ---- IP generator ---------------------------------------------------------- #}
{% set f = ip_form or {} %}
<section class="tool" id="tool-ip">
  <form class="panel tool-form" method="post" action="/ip"
        hx-post="/ip" hx-target="#ip-result" hx-swap="innerHTML">
    <h2>Random IP addresses</h2>
    <div class="fields">
      <label>Count
        <input name="count" inputmode="numeric" class="count" placeholder="e.g. 300"
               value="{{ f.count or '' }}">
      </label>
      <label>Network
        <input name="network" class="network" placeholder="e.g. 192.168.4.0/22"
               value="{{ f.network or '' }}">
      </label>
      <label>Output
        <select name="style">
          {% for value, text in [("plain", "192.168.4.17"), ("prefix", "192.168.4.17/22"),
                                 ("mask", "192.168.4.17 255.255.252.0")] %}
            <option value="{{ value }}" {{ 'selected' if f.style == value }}>{{ text }}</option>
          {% endfor %}
        </select>
      </label>
      <button type="submit">Generate</button>
      <button type="reset" class="secondary">Clear</button>
    </div>
    <p class="hint muted">
      Give a <b>network</b> to fill it completely, a <b>count</b> to get a subnet sized for it
      (300 → /23) in a random 172.16/12 or 192.168/16 block, or both.
      A network without a mask (172.20.0.0) plus a count builds the subnet there.
      Masks: <code>/22</code>, <code>/255.255.252.0</code> or <code>192.168.4.0 255.255.252.0</code>.
      Never repeats an address; skips network and broadcast; up to 65,534 at a time.
    </p>
  </form>
  <div id="ip-result" class="result">
    {% if ip_result %}{% with result = ip_result %}{% include "_result.html" %}{% endwith %}{% endif %}
  </div>
</section>

{# ---- MAC generator --------------------------------------------------------- #}
{% set f = mac_form or {} %}
<section class="tool" id="tool-mac">
  <form class="panel tool-form" method="post" action="/mac"
        hx-post="/mac" hx-target="#mac-result" hx-swap="innerHTML">
    <h2>Random MAC addresses</h2>
    <div class="fields">
      <label>Count
        <input name="count" inputmode="numeric" class="count" value="{{ f.count or '10' }}">
      </label>
      <fieldset class="choices">
        <legend>Type</legend>
        {% set mode = f.mode or 'local' %}
        <label><input type="radio" name="mode" value="local" {{ 'checked' if mode == 'local' }}>
          Locally administered</label>
        <label><input type="radio" name="mode" value="random" {{ 'checked' if mode == 'random' }}>
          Fully random</label>
        <label><input type="radio" name="mode" value="oui" {{ 'checked' if mode == 'oui' }}>
          With OUI prefix</label>
        <input name="oui" class="oui" placeholder="00:1a:2b" value="{{ f.oui or '' }}"
               aria-label="OUI prefix">
      </fieldset>
      {% set style = f.style or 'colon' %}
      {% include "_mac_format_fields.html" %}
      <button type="submit">Generate</button>
      <button type="reset" class="secondary">Clear</button>
    </div>
    <p class="hint muted">
      <b>Locally administered</b> MACs (second digit 2, 6, a or e) can't clash with a real vendor's
      address, so they're the safe choice for fake data. <b>Fully random</b> MACs may look like real
      vendors' addresses. Never repeats a MAC, never a multicast address; up to 65,534 at a time.
    </p>
  </form>
  <div id="mac-result" class="result">
    {% if mac_result %}{% with result = mac_result %}{% include "_result.html" %}{% endwith %}{% endif %}
  </div>
</section>

{# ---- MAC converter --------------------------------------------------------- #}
{% set f = convert_form or {} %}
<section class="tool" id="tool-convert">
  <form class="panel tool-form" method="post" action="/convert"
        hx-post="/convert" hx-target="#convert-result" hx-swap="innerHTML">
    <h2>Convert MAC addresses</h2>
    <textarea name="macs" class="output paste" rows="8" spellcheck="false"
              placeholder="Paste MAC addresses, one per line:&#10;02:1a:2b:3c:4d:5e&#10;021a.2b3c.4d5f&#10;02-1A-2B-3C-4D-60">{{ f.macs or '' }}</textarea>
    <div class="fields">
      <label class="check"><input type="checkbox" name="upper" {{ 'checked' if f.upper == 'on' }}> Uppercase</label>
      <button type="submit">Convert</button>
      <button type="reset" class="secondary">Clear</button>
    </div>
    <p class="hint muted">
      Shows every format at once, each with its own Copy button. Reads <code>aa:bb:cc:dd:ee:ff</code>, <code>aa-bb-cc-dd-ee-ff</code>, <code>aabb.ccdd.eeff</code>
      and <code>aabbccddeeff</code>, in any case. Lines that aren't MACs are listed, not dropped silently.
    </p>
  </form>
  <div id="convert-result" class="result">
    {% if convert_result %}{% with result = convert_result %}{% include "_result.html" %}{% endwith %}{% endif %}
  </div>
</section>

{# ---- Hostname faker ---------------------------------------------------------- #}
{% set f = hosts_form or {} %}
<section class="tool" id="tool-hosts">
  <form class="panel tool-form" method="post" action="/hosts"
        hx-post="/hosts" hx-target="#hosts-result" hx-swap="innerHTML">
    <h2>Fake hostnames</h2>
    {# Newline after ">" on purpose (see _result.html): keeps a leading blank row. #}
    <textarea name="hostnames" class="output paste" rows="8" spellcheck="false"
              placeholder="Paste hostnames, one per line (e.g. a spreadsheet column):&#10;exsite-lab-bld01a-cor-01&#10;exsite-lab-bld01a-dst-01&#10;hq6500a">
{{ f.hostnames or '' }}</textarea>
    <div class="fields">
      <label>Keep these parts
        <input name="keep" class="keep" placeholder="e.g. cor, dst, acc, hq"
               value="{{ f.keep or '' }}">
      </label>
      <label>Case
        <select name="case">
          {% for value, text in [("same", "Same as input"), ("lower", "lower"), ("upper", "UPPER")] %}
            <option value="{{ value }}" {{ 'selected' if f.case == value }}>{{ text }}</option>
          {% endfor %}
        </select>
      </label>
      <button type="submit">Fake</button>
      <button type="reset" class="secondary">Clear</button>
    </div>
    <p class="hint muted">
      Each hostname is split into parts at <code>-</code> and <code>_</code> and where letters meet
      digits (<code>hq6500a</code> → <code>hq</code> <code>6500</code> <code>a</code>). Parts on the
      keep list stay; every other part becomes random letters or digits of the same length.
      The same real part always gets the same fake, so devices at the same site still match up.
      One fake per line, same order, blank lines kept: paste the result straight back over the
      real column. Fake everything that belongs together in one go: a new paste gets new fakes.
    </p>
  </form>
  <div id="hosts-result" class="result">
    {% if hosts_result %}{% with result = hosts_result %}{% include "_result.html" %}{% endwith %}{% endif %}
  </div>
</section>

{# ---- OUI lookup ---------------------------------------------------------------
   Two forms (lookup, vendor search), each with its own result area: the
   form's data-result names it, so Clear empties the right one (app.js). #}
<section class="tool" id="tool-oui">
  {% set f = oui_lookup_form or {} %}
  <form class="panel tool-form" method="post" action="/oui/lookup" data-result="oui-lookup-result"
        hx-post="/oui/lookup" hx-target="#oui-lookup-result" hx-swap="innerHTML">
    <h2>Who made this MAC?</h2>
    {# data-enter-submits: Enter looks it up, Shift+Enter starts a new line
       (app.js). Pasting several lines works either way. Newline after ">"
       on purpose (see _result.html). #}
    <textarea name="macs" class="output paste" rows="2" spellcheck="false" data-enter-submits
              placeholder="A MAC in any format, or a prefix (00:1a:2b). Paste several, one per line, for a list.">
{{ f.macs or '' }}</textarea>
    <div class="fields">
      <button type="submit">Look up</button>
      <button type="reset" class="secondary">Clear</button>
    </div>
  </form>
  <div id="oui-lookup-result" class="result">
    {% if oui_lookup_result %}{% with result = oui_lookup_result %}{% include "_result.html" %}{% endwith %}{% endif %}
  </div>

  {% set f = oui_search_form or {} %}
  <form class="panel tool-form" method="post" action="/oui/search" data-result="oui-search-result"
        hx-post="/oui/search" hx-target="#oui-search-result" hx-swap="innerHTML">
    <h2>Find a vendor's prefixes</h2>
    <div class="fields">
      <label>Vendor name (or part of it)
        <input name="vendor" class="vendor" placeholder="e.g. example networks" value="{{ f.vendor or '' }}">
      </label>
      {% set style = f.style or 'colon' %}
      {% include "_mac_format_fields.html" %}
      <button type="submit">Find</button>
      <button type="reset" class="secondary">Clear</button>
    </div>
    <p class="hint muted">
      Lists every block IEEE registered to vendors whose name contains this text (any case).
      24-bit blocks are shown short (<code>00:1a:2b</code>); smaller blocks as an address with
      its length (<code>ac:12:34:50:00:00/28</code>).
    </p>
  </form>
  <div id="oui-search-result" class="result">
    {% if oui_search_result %}{% with result = oui_search_result %}{% include "_result.html" %}{% endwith %}{% endif %}
  </div>

  {% include "_oui_status.html" %}
</section>

{% endblock %}
